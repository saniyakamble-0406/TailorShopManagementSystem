
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profile - Tailor Shop Management System</title>
    <link rel="stylesheet" href="../css/form.css">
    <link rel="stylesheet" href="../css/soft-theme.css">
</head>
<body>

    <header class="form-header">
        <div>
            <h1>Edit Profile</h1>
            <p>Update your account and contact information</p>
        </div>

        <nav>
            <a href="../index.html">Home</a>
            <a href="customer-dashboard.html">Dashboard</a>
            <a href="profile.html">My Profile</a>
        </nav>
    </header>

    <main class="form-container">

        <form class="customer-form">

            <section class="form-section">
                <h2>Personal Information</h2>

                <div class="form-grid">

                    <div class="form-group">
                        <label for="full_name">Full Name</label>
                        <input
                            type="text"
                            id="full_name"
                            name="full_name"
                            placeholder="Enter your full name"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="username">Username</label>
                        <input
                            type="text"
                            id="username"
                            name="username"
                            placeholder="Enter username"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Enter email address"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="phone">Phone Number</label>
                        <input
                            type="tel"
                            id="phone"
                            name="phone"
                            placeholder="Enter phone number"
                            required
                        >
                    </div>

                </div>

                <div class="form-group full-width">
                    <label for="address">Address</label>
                    <textarea
                        id="address"
                        name="address"
                        rows="4"
                        placeholder="Enter your address"
                    ></textarea>
                </div>
            </section>

            <div class="form-actions">
                <a href="profile.html" class="cancel-btn">Cancel</a>
                <button type="submit" class="save-btn">Save Changes</button>
            </div>

        </form>

    </main>

    <footer class="footer">
        <p>© 2026 Tailor Shop Management System</p>
    </footer>

</body>
</html>
