
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Record Payment - Tailor Shop Management System</title>

    <meta
        name="description"
        content="Record a payment against a tailoring order."
    >

    <link rel="stylesheet" href="../css/form.css">
    <link rel="stylesheet" href="../css/soft-theme.css">
</head>

<body>

    <!-- Page Header -->
    <header class="form-header">
        <div>
            <h1>Record Payment</h1>
            <p>Enter payment details for a tailoring order</p>
        </div>

        <nav aria-label="Main navigation">
            <a href="../index.html">Home</a>
            <a href="admin-dashboard.html">Dashboard</a>
            <a href="payments.html">Payments</a>
            <a href="orders.html">Orders</a>
        </nav>
    </header>

    <!-- Main Payment Form -->
    <main class="form-container">

        <form class="customer-form">

            <section class="form-section">
                <h2>Payment Information</h2>

                <div class="form-grid">

                    <!-- Order Selection -->
                    <div class="form-group">
                        <label for="order">Order Number</label>

                        <select
                            id="order"
                            name="order"
                            required
                        >
                            <option value="">Loading orders...</option>
                        </select>
                    </div>

                    <!-- Payment Amount -->
                    <div class="form-group">
                        <label for="amount">Payment Amount (&#8377;)</label>

                        <input
                            type="number"
                            id="amount"
                            name="amount"
                            min="0.01"
                            step="0.01"
                            placeholder="Enter payment amount"
                            required
                        >
                    </div>

                    <!-- Payment Method -->
                    <div class="form-group">
                        <label for="payment_method">Payment Method</label>

                        <select
                            id="payment_method"
                            name="payment_method"
                            required
                        >
                            <option value="">Select Payment Method</option>
                            <option value="cash">Cash</option>
                            <option value="upi">UPI</option>
                            <option value="card">Card</option>
                            <option value="bank_transfer">Bank Transfer</option>
                        </select>
                    </div>

                    <!-- Payment Date and Time -->
                    <div class="form-group">
                        <label for="payment_date">
                            Payment Date and Time
                        </label>

                        <input
                            type="datetime-local"
                            id="payment_date"
                            name="payment_date"
                            required
                        >
                    </div>

                </div>

                <!-- Payment Notes -->
                <div class="form-group full-width">
                    <label for="notes">Payment Notes</label>

                    <textarea
                        id="notes"
                        name="notes"
                        rows="4"
                        maxlength="2000"
                        placeholder="e.g. Advance payment or final payment"
                    ></textarea>
                </div>

            </section>

            <!-- Form Actions -->
            <div class="form-actions">

                <a href="payments.html" class="cancel-btn">
                    Cancel
                </a>

                <button type="submit" class="save-btn">
                    Save Payment
                </button>

            </div>

        </form>

    </main>

    <!-- Footer -->
    <footer class="footer">
        <p>
            &copy; 2026 Tailor Shop Management System.
            All rights reserved.
        </p>
    </footer>

    <!-- Payment Form JavaScript -->
    <script src="../js/payment-form.js"></script>

</body>
</html>
