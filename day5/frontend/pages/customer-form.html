<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Customer - Tailor Shop Management System</title>

    <meta
        name="description"
        content="Create or update a customer profile in TailorShop."
    >

    <link rel="stylesheet" href="../css/form.css">
    <link rel="stylesheet" href="../css/soft-theme.css">
</head>

<body>

    <!-- Page Header -->
    <header class="form-header">

        <div>
            <h1>Add Customer</h1>
            <p>Create a new customer profile</p>
        </div>

        <nav aria-label="Main navigation">
            <a href="../index.html">Home</a>
            <a href="admin-dashboard.html">Dashboard</a>
            <a href="customers.html">Customers</a>
        </nav>

    </header>


    <!-- Main Form -->
    <main class="form-container">

        <form class="customer-form">

            <section class="form-section">

                <h2>Customer Information</h2>

                <div class="form-grid">

                    <!-- Full Name -->
                    <div class="form-group">
                        <label for="full_name">Full Name</label>

                        <input
                            type="text"
                            id="full_name"
                            name="full_name"
                            placeholder="Enter full name"
                            maxlength="150"
                            autocomplete="name"
                            required
                        >
                    </div>


                    <!-- Phone Number -->
                    <div class="form-group">
                        <label for="phone">Phone Number</label>

                        <input
                            type="tel"
                            id="phone"
                            name="phone"
                            placeholder="Enter phone number"
                            maxlength="15"
                            autocomplete="tel"
                            required
                        >
                    </div>


                    <!-- Email Address -->
                    <div class="form-group">
                        <label for="email">Email Address</label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Enter email address"
                            autocomplete="email"
                        >
                    </div>


                    <!-- Address -->
                    <div class="form-group">
                        <label for="address">Address</label>

                        <input
                            type="text"
                            id="address"
                            name="address"
                            placeholder="Enter address"
                            autocomplete="street-address"
                        >
                    </div>

                </div>


                <!-- Notes -->
                <div class="form-group full-width">

                    <label for="notes">Notes</label>

                    <textarea
                        id="notes"
                        name="notes"
                        rows="5"
                        placeholder="Enter customer notes"
                    ></textarea>

                </div>

            </section>


            <!-- Form Actions -->
            <div class="form-actions">

                <a href="customers.html" class="cancel-btn">
                    Cancel
                </a>

                <button
                    type="submit"
                    class="save-btn"
                >
                    Save Customer
                </button>

            </div>

        </form>

    </main>


    <!-- Footer -->
    <footer class="footer">
        <p>&copy; 2026 Tailor Shop Management System. All rights reserved.</p>
    </footer>


    <!-- Customer Form JavaScript -->
    <script src="../js/customer-form.js"></script>

</body>
</html>
